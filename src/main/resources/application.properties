spring.application.name=banking-app

# ---- XAMPP MySQL (default: user root, empty password) ----
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?useSSL=false&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=

# The tables already exist (sql/schema.sql), so Hibernate must not create or change them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Keep the console clean so the menu output is easy to screenshot.
spring.main.banner-mode=off
logging.level.root=WARN
